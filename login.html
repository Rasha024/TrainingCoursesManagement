<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Training Courses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Training Courses Management System</h1>
        <p>Welcome Back! Login to Your Account</p>
    </header>

    <!-- Navigation -->
    <nav>
        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="signup.html">Sign Up</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>

    <main>

        <!-- Login Form -->
        <section>
            <h2>Login</h2>

            <!-- Image with image map: click the image to open About Us -->
            <img src="images/home.jpg" alt="Training Courses - click to open About Us"
                 class="map-img" width="400" height="250" usemap="#aboutMap">
            <map name="aboutMap">
                <area shape="rect" coords="0,0,400,250" href="about.html" alt="About Us">
            </map>

            <!-- novalidate: validation is done by script.js -->
            <form id="loginForm" action="#" method="post" onsubmit="return validateLogin()" novalidate>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                           autocomplete="email">
                    <span id="emailError" class="error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                           autocomplete="current-password">
                    <span id="passwordError" class="error"></span>
                </div>

                <div class="form-group">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword" class="inline-label">Show Password</label>
                </div>

                <div class="form-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" class="inline-label">Remember Me</label>
                </div>

                <button type="submit" class="btn">Login</button>

            </form>

            <p>Don't have an account?
                <a href="signup.html">Create an Account</a>
            </p>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Training Courses Management System</p>
        <p>All Rights Reserved &copy; 2026</p>
    </footer>

    <!-- Embedded script: show / hide the password -->
    <script>
        document.getElementById("showPassword").addEventListener("change", function () {
            var pass = document.getElementById("password");
            if (this.checked) {
                pass.type = "text";
            } else {
                pass.type = "password";
            }
        });
    </script>

    <!-- External script -->
    <script src="script.js"></script>
</body>
</html>
